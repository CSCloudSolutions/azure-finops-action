name: 'Azure FinOps Cost Estimator'
description: 'Estimate Azure costs for Terraform & Bicep in PRs and enforce automated Budget Gates.'
author: 'CSCloudSolutions'

branding:
  icon: 'dollar-sign'
  color: 'blue'

inputs:
  api-key:
    description: 'CSCloudSolutions FinOps API key with write:shift-left scope. Pass via secrets.'
    required: true
  tool:
    description: 'IaC tool: terraform (default), tofu, or bicep.'
    required: false
    default: 'terraform'
  plan-file:
    description: 'Binary plan file from terraform/tofu plan -out=... (Ignored if plan-json is provided).'
    required: false
    default: 'tfplan.bin'
  plan-json:
    description: 'Plan formatted as JSON (terraform show -json) or az deployment group what-if output.'
    required: false
    default: ''
  threshold-usd:
    description: 'Maximum monthly delta in USD/month. Strictest threshold between workflow and platform wins.'
    required: false
    default: ''
  comment:
    description: 'Comment results on Pull Request (updates sticky comment on push). Requires pull-requests: write.'
    required: false
    default: 'true'
  api-url:
    description: 'Base platform endpoint URL.'
    required: false
    default: 'https://finops.cscloudsolutions.com.ar'
  script-sha256:
    description: 'Expected SHA-256 hash of estimation script.'
    required: false
    default: ''

outputs:
  delta-usd:
    description: 'Monthly cost delta in USD (negative if PR saves money).'
    value: ${{ steps.estimar.outputs.delta }}
  projected-usd:
    description: 'Total projected monthly cost in USD.'
    value: ${{ steps.estimar.outputs.projected }}
  unpriced:
    description: 'Number of unpriced or usage-based resources.'
    value: ${{ steps.estimar.outputs.unpriced }}
  gate-status:
    description: 'Budget Gate status: OK, EXCEEDED, or NOT_EVALUATED.'
    value: ${{ steps.estimar.outputs.gate }}

runs:
  using: 'composite'
  steps:
    - id: estimar
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        FINOPS_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ github.token }}
        FINOPS_REPOSITORY: ${{ github.repository }}
        FINOPS_PR_NUMBER: ${{ github.event.pull_request.number }}
        FINOPS_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        FINOPS_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
        FINOPS_API_URL: ${{ inputs.api-url }}
        FINOPS_TOOL: ${{ inputs.tool }}
        FINOPS_PLAN_FILE: ${{ inputs.plan-file }}
        FINOPS_PLAN_JSON: ${{ inputs.plan-json }}
        FINOPS_THRESHOLD_USD: ${{ inputs.threshold-usd }}
        FINOPS_COMMENT: ${{ inputs.comment }}
        SCRIPT_SHA256: ${{ inputs.script-sha256 }}
      run: |
        set -euo pipefail
        if [ -n "${ACTION_PATH:-}" ] && [ -f "${ACTION_PATH}/finops-estimate.sh" ] && [ "${FINOPS_API_URL}" = "https://finops.cscloudsolutions.com.ar" ] && [ -z "$SCRIPT_SHA256" ]; then
          script="${ACTION_PATH}/finops-estimate.sh"
        else
          script="$RUNNER_TEMP/finops-estimate.sh"
          curl -fsSL "${FINOPS_API_URL%/}/integrations/shift-left/finops-estimate.sh" -o "$script"
          if [ -n "$SCRIPT_SHA256" ]; then
            echo "$SCRIPT_SHA256  $script" | sha256sum -c -
          fi
        fi
        bash "$script"
